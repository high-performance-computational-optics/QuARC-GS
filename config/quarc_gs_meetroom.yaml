# QuARC-GS on MeetRoom -- the full method at the shipping density (max_gs_per_grid = 4).
#
# Frame 0 is TRAINED, not restored. Run it once per scene, then stream from the checkpoint it
# writes (README sections 2c and 2d):
#
#   # 1. train frame 0 -> writes ckpt-0-10000.pth
#   python main.py --pipeline=QuARC-GS --config=config/quarc_gs_meetroom.yaml \
#       data.root=<DATA>/discussion_undist output_dir=<OUT>/frame0 experiment_name=discussion \
#       data.extra_dataset_kwargs.num_frames=1
#
#   # 2. stream all 300 frames from it
#   python main.py --pipeline=QuARC-GS --config=config/quarc_gs_meetroom.yaml \
#       data.root=<DATA>/discussion_undist output_dir=<OUT> experiment_name=discussion \
#       ckpt_path=<OUT>/frame0/discussion/<timestamp>/ckpt-0-10000.pth
#
# num_init_steps below MUST match the <N> in that filename, or step 2 retrains frame 0 instead of
# restoring it. The log line `Training frame 0: 0it` confirms a restore.
#
# UNDISTORTED DATA IS MANDATORY. The reported MeetRoom numbers come from the COLMAP-undistorted
# (3DGStream-style) build. Running the distorted build instead scores ~3.7 dB LOWER and looks like
# a method regression. See README section 2b.
#
# Ablations: flip one switch at a time -- deformation.enable_quant=false, motion.change_densify=false,
# motion.quant_appearance=false. Storage is reported on ONE axis: the Shannon entropy estimate
# (storage/total_kb).

output_dir: ./output/quarc_gs_meetroom
experiment_name: <SCENE>
mode: train
ckpt_path: null            # set to your frame-0 checkpoint for step 2
trainer:
  cache_data_on_device: true
  testing_steps: []
  saving_ckpt_steps: []
  saving_ckpt_every_n_frames: 1000
  num_init_steps: 10000     # frame-0 training budget; must match ckpt-0-<N>.pth
  num_incr_steps: 200
data:
  root: <DATA_ROOT>/<SCENE>_undist    # UNDISTORTED build -- see note above
  resolution: -1            # native ~1223x685; under the 1600px cap so no downscale
  white_background: false
  split_train_test: true
  shuffle: true
  eval_train: false
  eval_test: true
  extra_dataset_kwargs:
    num_frames: 300
    eval_pose_indices:
    - 0
  extra_dataloader_kwargs: {}
module:
  sh_degree: 1
  random_background: false
  lambda_dssim: 0.2
  lambda_deform: 1.0
  noise_scale: 0.01
  saving_gs_steps: []
  saving_gs_every_n_frames: 1000
  num_saving_images: 5
  full_eval: true           # inert for metrics: QuARC-GS always logs PSNR/SSIM/LPIPS
  lpips_required: false
  merge_to_base: true
  re_hierarchization: true
  densify:
    from_step: 500
    until_step: 5000
    interval: 100
    grad_threshold: 0.0002
    opacity_reset_interval: 30000
    max_gaussians: 10000000
  gaussian:
    position_lr_init: 0.00016
    position_lr_final: 1.6e-06
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 10000
    feature_lr: 0.0025
    opacity_lr: 0.05
    scaling_lr: 0.005
    rotation_lr: 0.001
    percent_dense: 0.01
  gaussian_stage2:
    position_lr_init: 0.0024
    position_lr_final: 2.4e-05
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 10000
    feature_lr: 0.0375
    opacity_lr: 0.75
    scaling_lr: 0.075
    rotation_lr: 0.015
    percent_dense: 0.01
  renderer:
    compute_cov3D_python: false
    convert_SHs_python: false
    debug_from: -1
    debug: false
  deformation:
    quantile: 0.05
    lr: 0.0005
    num_stage1_steps: 100
    max_gs_per_grid: 4      # SHIPPING VALUE. 16 was the old default and scores ~0.59 dB lower
    num_grid_levels: 3
    grid_level_ratio: 3
    momentum: 0.6
    densify_interval: 40
    densify_grad_threshold: 0.00015
    opacity_threshold: 0.01
    grid_reset_interval: 4  # MeetRoom uses 4 (N3DV uses 2)
    enable_quant: true      # [method] STE-quantized motion delta
    quant_step_xyz: 0.0017
    quant_step_quat: 0.01
  motion:
    quant_appearance: true  # [method] quantized appearance delta
    change_densify: true    # [method] change-gated densification
    change_views: 4
gui_ip: 127.0.0.1
gui_port: 6231              # must be UNIQUE per concurrent process (bind is unconditional)
detect_anomaly: false
quiet: false
